spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:mysql://${DEV_DB_HOST}:3306/${DEV_DB_NAME}?&useSSL=false&useUnicode=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8&rewriteBatchedStatements=true
    username: ${DEV_DB_USER}
    password: ${DEV_DB_PW}
  jpa:
    show-sql: false       # SQL문 안봄(dev 서버 로그 과부하 방지)
    hibernate:
      ddl-auto: update

# DEV 서버 로깅 전략 - INFO, DEBUG 전부 보이게 설정
logging:
  level:
    root: INFO                           # 정상 흐름만 출력
    com.likelion.routineeatbe: DEBUG     # 프로젝트 루트 밑의 debug 로그는 허용
    org.hibernate.SQL: WARN              # SQL은 경고 이상만 (show-sql: false와 맞춤)
    org.springframework.web: INFO        # 요청/응답 흐름 확인
    org.springframework.security: INFO   # 인증/인가 흐름 확인

# server.servlet.session.cookie.true: HTTPS에서만 브라우저가 세션 쿠키를 전송하는 옵션
server:
  forward-headers-strategy: framework   # Nginx 프록시 뒤 HTTPS 환경에서 forwarded header 처리
  url: https://api.nahjjun.cloud
  servlet:
    session:
      cookie:
        secure: true

# Dev 서버 Swagger UI 설정 - Dev 서버에서 Swagger 접속 가능하게 설정 (운영 서버에서는 비활성화)
springdoc:
  swagger-ui:
    enabled: true